<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control Group Consortium | Website Wireframe</title>
<style>
:root{
  --ink:#17263a;--muted:#526279;--accent:#2551ab;--accent-dark:#163974;
  --blue-bg:#eaf1ff;--surface:#fff;--bg:#f5f7fa;--line:#d9e1ec;
  --soft:#edf1f6;--green:#22563f;--green-bg:#e7f5ed;
  --amber:#745000;--amber-bg:#fff2d6;--red:#8c3945;--red-bg:#fbecef;
  font-family:Inter,Geist,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5
}
*{box-sizing:border-box}
body{margin:0}
a{color:var(--accent);text-underline-offset:3px}
button,input,select,textarea{font:inherit}
button,select,summary{cursor:pointer}
:focus-visible{outline:3px solid #4381ed;outline-offset:3px}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(2rem,4vw,3.08rem);line-height:1.08;letter-spacing:-.055em;font-weight:740}
h2{font-size:1.24rem;line-height:1.3;letter-spacing:-.022em}
h3{font-size:1.06rem;line-height:1.3;letter-spacing:-.015em}
small,.small{font-size:.85rem}
.muted{color:var(--muted)}
.mono{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.wrap{width:min(1180px,calc(100% - 64px));margin-inline:auto}
.top{background:#14273e;color:white}
.top .wrap{min-height:72px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.brand{display:inline-flex;align-items:center;gap:12px;color:inherit;text-decoration:none;font-weight:680;letter-spacing:-.02em}
.mark{display:grid;grid-template-columns:repeat(2,7px);grid-template-rows:repeat(2,7px);gap:3px;padding:9px;background:#294366;border-radius:8px;flex:none}
.mark span{background:#c3d6ff;border-radius:1px}
.mark span:nth-child(2){background:transparent;border:1px solid #c3d6ff}
.role{display:flex;align-items:center;gap:10px;color:#e3ecfa;font-size:.86rem;white-space:nowrap}
.role select{min-height:36px;padding:6px 34px 6px 10px;background:#253d5a;color:white;border:1px solid #536988;border-radius:7px}
.nav{background:var(--surface);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;gap:25px;overflow:auto}
.nav a{min-height:51px;display:flex;align-items:center;border-bottom:3px solid transparent;padding:3px 2px 0;color:var(--muted);text-decoration:none;font-weight:590;white-space:nowrap}
.nav a[aria-current]{color:var(--accent-dark);border-bottom-color:var(--accent)}
.skip{position:absolute;left:16px;top:-100px;background:white;color:var(--ink);padding:12px;z-index:2}
.skip:focus{top:12px}
main{min-height:calc(100vh - 208px);padding-block:30px 48px}
#main:focus{outline:none}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:28px}
.pagehead p{max-width:64ch;margin-top:11px;color:var(--muted)}
.crumb{display:inline-block;margin-bottom:14px;text-decoration:none;font-weight:620}
.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;min-height:42px;border:1px solid var(--line);border-radius:7px;color:var(--ink);background:white;text-decoration:none;font-weight:650;white-space:nowrap}
.button:hover{background:var(--soft)}
.button.primary{background:var(--accent);color:white;border-color:var(--accent)}
.button.primary:hover{background:var(--accent-dark)}
.button.danger{color:var(--red)}
.button:disabled{opacity:.5;cursor:default}
.hero{background:#ecf2fc;border:1px solid #d6e2f6;border-radius:13px;padding:27px 30px 24px;margin-bottom:19px}
.hero .pagehead{margin-bottom:19px;align-items:center;justify-content:center;text-align:center}
.hero h1{max-width:18ch;margin-inline:auto}
.hero .search{margin-inline:auto}
.search{display:flex;gap:9px;max-width:720px}
input,select,textarea{border:1px solid #bfcbdb;border-radius:7px;background:white;color:var(--ink);padding:9px 11px;width:100%;min-width:0;min-height:42px}
textarea{resize:vertical}
.search input{flex:1 1 auto}
.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:11px}
.panel{padding:19px}
.columns{display:grid;grid-template-columns:226px minmax(0,1fr);gap:19px;align-items:start}
.results-top,.panel-head,.actions{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.results-top{padding:2px 0 12px}
.results-top label{display:flex;align-items:center;gap:8px;color:var(--muted)}
.results-top select{width:auto;min-height:36px;padding-block:6px}
.field{display:grid;gap:5px;font-weight:630}
.field small{font-weight:450;color:var(--muted)}
.filters{display:grid;gap:14px}
.link-button{border:0;background:none;padding:0;color:var(--accent);font-weight:650;text-decoration:underline;text-underline-offset:3px}
.segment{display:flex;gap:4px;flex-wrap:wrap}
.segment button{border:1px solid transparent;padding:6px 10px;min-height:36px;border-radius:6px;background:transparent;color:var(--muted);font-weight:620}
.segment button[aria-pressed=true]{background:var(--blue-bg);border-color:#d6e3ff;color:var(--accent-dark)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.resource{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.resource-head{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:12px 14px;border-bottom:1px solid var(--line);background:#f8fafd}
.resource-type{font-size:.74rem;font-weight:690;letter-spacing:.025em;color:var(--muted)}
.resource-body{padding:14px;flex:1}
.resource-body p{margin-top:7px}
.resource-foot{border-top:1px solid var(--line);padding:9px 14px;font-size:.88rem}
.resource-foot a{font-weight:650;text-decoration:none}
.resource-foot a:hover{text-decoration:underline}
.badge{display:inline-block;font-size:.73rem;line-height:1.3;padding:4px 8px;border-radius:20px;background:var(--soft);color:var(--muted);white-space:nowrap;font-weight:680}
.badge.active,.badge.approved,.badge.completed{background:var(--green-bg);color:var(--green)}
.badge.pending,.badge.alternative_proposed,.badge.maintenance,.badge.calibration{background:var(--amber-bg);color:var(--amber)}
.badge.rejected{background:var(--red-bg);color:var(--red)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.detail-grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(245px,1fr);align-items:start;gap:17px}
.stack{display:grid;gap:15px;min-width:0}
.layout-form{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(245px,1fr);align-items:start;gap:17px}
dl{margin:0;display:grid;grid-template-columns:minmax(124px,.52fr) minmax(0,1fr)}
dt,dd{padding-block:9px;border-bottom:1px solid var(--line)}
dt:last-of-type,dd:last-of-type{border-bottom:0}
dt{color:var(--muted);padding-right:10px}
dd{margin:0;overflow-wrap:anywhere}
.panel-head{margin-bottom:11px}
.section-copy{margin-top:6px;margin-bottom:12px;color:var(--muted)}
.inline-note{border-radius:8px;padding:11px 13px;background:var(--blue-bg);color:#264571;font-size:.89rem}
.form-group{display:grid;gap:13px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.form-panel h2{margin-bottom:13px}
.form-panel fieldset{border:none;padding:0;margin:0;min-width:0}
.form-panel legend{padding:0;font-weight:650;margin-bottom:5px}
.radios{display:flex;gap:13px;flex-wrap:wrap;margin-bottom:11px}
.radios label{display:flex;align-items:center;gap:5px;font-weight:500}
.radios input{width:auto;min-height:0}
table{border-collapse:collapse;width:100%;text-align:left;font-size:.88rem}
.table-scroll{overflow:auto}
th,td{padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#f0f4f9;color:#445770;font-weight:630}
tbody tr:last-child td{border-bottom:0}
td a{font-weight:620}
td:last-child{overflow-wrap:anywhere}
.empty{padding:20px;color:var(--muted)}
.timeline{list-style:none;padding:0;margin:0 0 0 5px;border-left:2px solid #d4e0f4}
.timeline li{position:relative;padding:3px 0 13px 15px}
.timeline li:before{content:"";position:absolute;left:-5px;top:10px;width:8px;height:8px;border-radius:50%;background:#4577cf}
.timeline li:last-child{padding-bottom:4px}
.timeline p{margin-top:3px;color:var(--muted)}
.reports{display:grid;grid-template-columns:246px minmax(0,1fr);gap:16px;align-items:start}
.report-nav h2{font-size:1.02rem;margin-bottom:10px}
.report-nav a{display:block;padding:8px 10px;text-decoration:none;border-radius:6px;color:var(--ink);font-size:.88rem}
.report-nav [aria-current]{background:var(--blue-bg);color:var(--accent-dark);font-weight:700}
.report-nav a:hover{background:var(--soft)}
.report-toolbar{display:flex;align-items:end;gap:8px;margin-block:10px 15px}
.report-toolbar select{max-width:220px}
.chart{display:grid;gap:11px;padding:13px 0 16px}
.bar-row{display:grid;grid-template-columns: minmax(142px,1fr) minmax(70px,1.6fr) 67px;gap:8px;align-items:center;font-size:.83rem}
.bar-track{height:10px;border-radius:2px;background:#eaf0f9;overflow:hidden}
.bar-fill{height:100%;background:#5079c9;border-radius:2px}
.confirm{margin-bottom:14px}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.82rem}
footer .wrap{padding-block:15px}
[hidden]{display:none!important}
@media(max-width:980px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{width:min(100% - 40px,1180px)}}
@media(max-width:700px){
 .wrap{width:calc(100% - 28px)} main{padding-top:18px}.top .wrap{min-height:66px;gap:8px}
 .brand{font-size:.88rem;gap:7px}.mark{padding:7px}.role label{display:none}.role select{max-width:114px;font-size:.77rem;padding-right:8px}
 .nav .wrap{gap:18px}.nav a{min-height:45px;font-size:.88rem}
 .hero{padding:18px 15px}.pagehead{align-items:flex-start;flex-direction:column;margin-bottom:17px}
 .columns,.detail-grid,.layout-form,.reports{grid-template-columns:1fr}
 .filters{grid-template-columns:1fr 1fr;gap:10px}.filters .panel-head{grid-column:1/-1;margin:0}
 .panel{padding:14px}.report-nav{display:grid;grid-template-columns:1fr 1fr}.report-nav h2{grid-column:1/-1}
}
@media(max-width:400px){.cards,.form-row{grid-template-columns:1fr}.button{padding-inline:10px}.bar-row{grid-template-columns:1fr 1fr 45px}}
@media print{
 :root{background:white}
 .wrap{width:100%}
 .top,.nav,.button,.search,.filters,.role,.pager{display:none!important}
 main{padding:0;min-height:0}
 .columns,.reports{display:block}
 .report-nav{display:none}
 .card,.panel{break-inside:avoid}
}
</style>
</head>

  const query = f.search.trim().toLowerCase();

    (!f.type || item.type === f.type) && (!f.facility || item.facility_id === Number(f.facility)) &&
    (!query || [item.name,item.facility,item.campus,item.capabilities,nice(item.type)].some(s=>String(s ?? '').toLowerCase().includes(query))));
  if (f.sort === 'name') list.sort((a,b)=>a.name.localeCompare(b.name));
  return list;
}
function renderResources() {
  const f = state.resources;
  const source = f.kind === 'equipment' ? equipment : facilities;
  const types = [...new Set(source.map(item=>item.type))].sort().map(type=>[type,nice(type)]);
  main.innerHTML = '<section class="hero">'+title('Resource directory','Find shared equipment and lab spaces, review access requirements, and request time for your experiment.')+
    '<form class="search" id="resource-search"><label class="sr-only" for="search">Search resources</label><input id="search" type="search" value="'+esc(f.search)+'" placeholder="Search by equipment, facility, or capability"><button class="button primary">Search</button></form></section>'+
    '<div class="columns"><aside class="panel filters" aria-label="Resource filters">'+heading('Filters','<button class="link-button small" id="reset">Reset</button>')+
    choice('Resource type','resource-type',[['','All types'],...types],f.type)+
    (f.kind==='equipment'?choice('Facility','facility',[['','All facilities'],...facilities.map(({id,name})=>[id,name])],f.facility):'')+
    '</aside><section aria-label="Results"><div class="results-top"><div class="segment" aria-label="Resource kind">'+
    ['equipment','facility'].map(kind=>'<button data-kind="'+kind+'" aria-pressed="'+(f.kind===kind)+'">'+(kind==='equipment'?'Equipment':'Facilities')+'</button>').join('')+
    '</div><label for="sort" class="small">Sort <select id="sort">'+options([['featured','Featured'],['name','Name A–Z']],f.sort)+'</select></label></div><div id="results"></div></section></div>';
  updateResults();
  main.querySelector('#resource-search').onsubmit = event => {event.preventDefault(); f.search=main.querySelector('#search').value; f.page=1; updateResults();};
  main.querySelectorAll('[data-kind]').forEach(button=>button.onclick=()=>{
    Object.assign(f,{kind:button.dataset.kind,type:'',facility:'',page:1,search:main.querySelector('#search').value});
    renderResources();
    main.querySelector('[data-kind="'+f.kind+'"]').focus();
  });
  for (const [id,key] of [['resource-type','type'],['facility','facility'],['sort','sort']]) {
    const control = main.querySelector('#'+id);
    if (control) control.onchange = () => {f[key]=control.value;f.page=1;updateResults();};
  }
  main.querySelector('#reset').onclick = () => {
    Object.assign(f,{search:'',type:'',facility:'',sort:'featured',page:1});
    renderResources();
    main.querySelector('#search').focus();
  };
}
function updateResults() {
  const f = state.resources, count = filteredResources(), target=main.querySelector('#results');
  const last = Math.max(1,Math.ceil(count.length/pageSize));
  f.page = Math.min(f.page,last);
  const firstRow = (f.page-1)*pageSize;
  target.innerHTML = '<p class="small muted" role="status" style="margin:0 0 10px">'+count.length+' '+(f.kind==='equipment'?'equipment':'facility')+(count.length===1?' record':' records')+'</p>'+
    (count.length ? '<div class="cards">'+count.slice(firstRow,firstRow+pageSize).map(item=>card(item,f.kind)).join('')+'</div>' : '<div class="panel empty">No resources match these filters.</div>')+
    (last>1 ? '<div class="pager"><span class="small muted">Page '+f.page+' of '+last+'</span><div class="actions"><button class="button" data-page="prev" '+(f.page===1?'disabled':'')+'>Previous</button><button class="button" data-page="next" '+(f.page===last?'disabled':'')+'>Next</button></div></div>' : '');
  target.querySelectorAll('[data-page]').forEach(button=>button.onclick=()=>{
    f.page += button.dataset.page==='prev'?-1:1;
    updateResults();
    (target.querySelector('[data-page="'+button.dataset.page+'"]:enabled') || target.querySelector('a'))?.focus();
  });
}
function renderResource(kind,id) {
  const isEquipment = kind==='equipment';
  const item = byId(isEquipment?equipment:facilities,id);
  if(!item) return renderMissing();
  const events = data.events[kind][item.id] || [];
  const related = equipment.filter(eq=>eq.facility_id===item.id);
  const requestAction = state.role==='researcher' ? '<a class="button primary" href="#new/'+kind+'/'+item.id+'">Request access →</a>' : '';
  main.innerHTML = back('resources','Resource directory')+title(item.name,isEquipment?item.facility:item.campus,requestAction)+
    '<div class="detail-grid"><div class="stack"><section class="panel">'+heading('Resource information',status(item.status))+
    fields([['Type',nice(item.type)],['Campus',item.campus],['Facility',isEquipment?item.facility:item.name],['Capabilities',item.capabilities],['Access requirements',item.restrictions],['Training',item.training],['Configuration',item.configuration]])+
    '</section><section class="panel">'+heading('Schedule and service history')+'<p class="section-copy small">Recorded reservations, maintenance and calibration · UTC</p>'+
    table(['Event','Reserved time','Status'],events.map(e=>[esc(nice(e.type)),esc(when(e.start))+'<br><span class="muted">to '+esc(when(e.end))+'</span>',status(e.status)]))+
    '</section></div><aside class="stack">'+(isEquipment?
    '<section class="panel">'+heading('Location')+'<p>'+esc(item.facility)+'</p><p class="muted small">'+esc(item.campus)+'</p><p style="margin-top:10px"><a href="'+idLink('facility',item.facility_id)+'">View facility →</a></p></section>':
    '<section class="panel">'+heading('Equipment in this facility')+(related.length ? related.slice(0,6).map(eq=>'<p style="margin:6px 0"><a href="'+idLink('equipment',eq.id)+'">'+esc(eq.name)+'</a></p>').join('') : '<p class="muted small">No catalog equipment linked.</p>')+'</section>')+
    (state.role==='researcher'?'<section class="panel">'+heading('Access process')+'<p class="muted small">Choose an experiment and submit a request for staff review. Check the decision in My requests.</p></section>':'')+'</aside></div>';
}
function renderForm(kind,id) {
  const item = byId(kind==='equipment'?equipment:facilities,id);
  const context = item ? item.name : '';
  const previous = item ? kind+'/'+item.id : 'requests';
  main.innerHTML = back(previous,item?'Resource details':'My requests')+title('Request access','Tell the scheduling team what you need for your experiment.')+
    '<div class="layout-form"><form class="stack" id="request-form"><section class="panel form-panel form-group"><h2>Experiment and resources</h2>'+
    '<div class="form-row"><label class="field">Project<select name="project" id="project" required>'+options(data.projects.map(p=>[p.id,p.name]),data.projects[0]?.id)+'</select></label>'+
    '<label class="field">Experiment<select name="experiment" id="experiment" required></select></label></div>'+
    '<label class="field">Equipment or facility requirements<textarea name="requirements" rows="2" required placeholder="Name the resources and configuration you need">'+esc(context)+'</textarea></label>'+
    '</section><section class="panel form-panel form-group"><h2>Preferred timing</h2><fieldset><legend>Timing preference</legend>'+
    '<div class="radios"><label><input type="radio" name="timing" value="window" checked>Specific time window</label><label><input type="radio" name="timing" value="duration">Flexible timing</label></div>'+
    '<div class="form-row" id="window"><label class="field">Start (UTC)<input type="datetime-local" name="start" required></label>'+
    '<label class="field">End (UTC)<input type="datetime-local" name="end" required></label></div>'+
    '<label class="field" id="duration" hidden>Requested duration (minutes)<input type="number" name="duration" min="1" step="1" disabled></label>'+
    '</fieldset></section><section class="panel form-panel form-group"><h2>Additional details</h2>'+
    '<label class="field">Safety considerations <small>Optional</small><textarea name="safety" rows="2"></textarea></label>'+
    '<label class="field">Special conditions <small>Optional</small><textarea name="conditions" rows="2"></textarea></label></section>'+
    '<div class="actions"><a class="button" href="#'+previous+'">Cancel</a><button class="button primary" type="submit">Submit demo request</button></div></form>'+
    '<aside class="stack"><section class="panel">'+heading('Request summary')+
    fields([['Researcher',data.researcher.name],['Institution',data.researcher.institution],['Resource',context||'Enter in the form']])+'</section>'+
    '<p class="inline-note">The request appears in My requests and the staff Review queue in this preview.</p></aside></div>';
  const form = document.querySelector('#request-form');
  const project = form.elements.project, experiment = form.elements.experiment;
  function setExperiments() {
    experiment.innerHTML = options(data.experiments.filter(exp=>exp.project_id===Number(project.value)).map(exp=>[exp.id,exp.name]),null);
  }
  project.onchange = setExperiments;
  setExperiments();
  form.querySelectorAll('input[name="timing"]').forEach(radio=>radio.onchange=()=>{
    const flexible = form.elements.timing.value==='duration';
    document.querySelector('#window').hidden=flexible;
    document.querySelector('#duration').hidden=!flexible;
    for(const field of ['start','end']){form.elements[field].disabled=flexible;form.elements[field].required=!flexible;}
    form.elements.duration.disabled=!flexible;
    form.elements.duration.required=flexible;
    form.elements.end.setCustomValidity('');
  });
  form.elements.end.oninput = form.elements.start.oninput = () => form.elements.end.setCustomValidity('');
  form.onsubmit = event => {
    event.preventDefault();
    const record = new FormData(form);
    const start = record.get('start'), end = record.get('end');
    if(start && end && end<=start) {
      form.elements.end.setCustomValidity('Choose an end time after the start.');
      form.elements.end.reportValidity();
      return;
    }
    const exp = byId(data.experiments,record.get('experiment'));
    const id = Math.max(...data.requests.map(req=>req.id),0)+1;
    data.requests.unshift({id, experiment:exp.name, project:byId(data.projects,exp.project_id).name,
      researcher_id:data.researcher.id, researcher:data.researcher.name, institution:data.researcher.institution,
      submitted:new Date().toISOString().slice(0,19).replace('T',' '), start:start?.replace('T',' '), end:end?.replace('T',' '),
      duration:record.get('duration'), requirements:record.get('requirements'), safety:record.get('safety'), conditions:record.get('conditions'), status:'pending', decisions:[], sessions:[]});
    state.toast='Demo request #'+id+' submitted for staff review.';
    go('request/'+id);
  };
}
function renderRequests(admin) {
  const selector = admin?'reviewStatus':'requestStatus';
  const records = data.requests.filter(req=>admin||req.researcher_id===data.researcher.id);
  const visible=records.filter(req=>state[selector]==='all'||req.status===state[selector]).sort((a,b)=>b.submitted.localeCompare(a.submitted));
  const list = admin?'review':'requests';
  main.innerHTML = title(admin?'Review queue':'My requests',admin?'Review research requests and record scheduling decisions.':'Track requests, staff decisions and scheduled sessions.',
    admin?'':'<a class="button primary" href="#new">New request</a>')+
    '<section class="panel">'+heading(admin?'Requests to review':'Request history',choice('Status','request-filter',[['all','All statuses'],...['pending','approved','rejected','cancelled'].map(key=>[key,nice(key)])],state[selector]))+
    table(['Request','Experiment',admin?'Researcher':'Requested resource','Submitted (UTC)','Status'],visible.map(req=>[
      '<a href="'+idLink(admin?'review-request':'request',req.id)+'">#'+req.id+'</a>',esc(req.experiment),esc(admin?req.researcher:req.requirements),esc(when(req.submitted)),status(req.status)
    ]))+'</section>';
  document.querySelector('#request-filter').onchange=event=>{
    state[selector]=event.target.value;
    renderRequests(admin);
    document.querySelector('#request-filter').focus();
  };
}
function renderRequest(id,admin) {
  const req = byId(data.requests,id);
  if(!req || (!admin && req.researcher_id!==data.researcher.id)) return renderMissing();
  const submitted = state.toast ? '<p class="inline-note confirm" role="status">'+esc(state.toast)+'</p>' : '';
  state.toast='';
  const decisionHistory = [{type:'submitted', at:req.submitted, staff:'', reason:''},...req.decisions];
  const pending = req.status==='pending';
  main.innerHTML = back(admin?'review':'requests',admin?'Review queue':'My requests')+submitted+
    title('Request #'+req.id,req.experiment+' · '+req.project,status(req.status))+
    '<div class="detail-grid"><div class="stack"><section class="panel">'+heading('Request details')+
    fields([['Researcher',req.researcher],['Institution',req.institution],['Resources',req.requirements],
      ['Requested window',req.start?when(req.start)+' to '+when(req.end)+' UTC':null],['Duration',req.duration?req.duration+' minutes':null],['Safety',req.safety||null],['Special conditions',req.conditions||null]])+
    '</section><section class="panel">'+heading('Scheduled sessions')+table(['Event','Scheduled start (UTC)','Status'],req.sessions.map(e=>[esc(nice(e.type)),esc(when(e.start)),status(e.status)]))+'</section></div>'+
    '<aside class="stack"><section class="panel">'+heading('Decision history')+'<ol class="timeline">'+decisionHistory.map(dec=>'<li><strong>'+esc(nice(dec.type))+'</strong><p class="small">'+esc(when(dec.at))+' UTC'+(dec.staff?' · '+esc(dec.staff):'')+'</p>'+(dec.reason?'<p class="small">'+esc(dec.reason)+'</p>':'')+'</li>').join('')+'</ol></section>'+
    (admin&&pending?'<section class="panel"><form class="form-group" id="decision"><h2>Record a decision</h2>'+
    '<label class="field">Decision<select name="decision"><option value="approved">Approve</option><option value="alternative_proposed">Propose alternative</option><option value="rejected">Reject</option></select></label>'+
    '<label class="field">Reason or proposed change<textarea name="reason" rows="3" required></textarea></label><button class="button primary">Save demo decision</button></form></section>':'')+'</aside></div>';
  const form = document.querySelector('#decision');
  if (form) form.onsubmit=event=>{
    event.preventDefault();
    const details=new FormData(form), type=details.get('decision');
    if(type !== 'alternative_proposed') req.status=type;
    req.decisions.push({type,at:new Date().toISOString().slice(0,19).replace('T',' '),staff:'Demo reviewer',reason:details.get('reason')});
    state.toast='Demo decision recorded.';
    renderRequest(req.id,true);
    main.focus();
  };
}
const namedReports = [
  ['Facility usage','Actual facility-use hours by month.'],
  ['Equipment maintenance','Reserved maintenance and calibration hours by equipment.'],
  ['Request response time','Average time to the first staff decision by institution.'],
  ['Staff hours','Actual versus planned work hours for comparable assignments.'],
  ['Funding costs','Base charges, signed adjustments and net cost by funding source and month.'],
  ['Shared charges','Finalized usage charges shared by multiple experiments or payers.'],
  ['Access denial rates','Denied attempts as a share of logged access attempts by resource and month.'],
  ['Cross-institution research','Experiments involving more than one institution by project.']
];
const reportColumns = [
  ['Month','Facility','Actual hours'],
  ['Equipment','Service events','Maintenance h','Calibration h','Total h'],
  ['Institution','Requests','With decision','Without decision','Avg. hours'],
  ['Staff member','Compared','Planned h','Actual h','Difference h'],
  ['Month','Funding source','Base USD','Adjustments USD','Net USD'],
  ['Use ID','Resource','Experiment','Payer','Charge USD'],
  ['Month','Resource type','Resource','Attempts','Denied','Denial %'],
  ['Project','Experiments','Cross-institution','Share %']
];
function renderReports(index) {
  const n=Math.min(namedReports.length,Math.max(1,Number.parseInt(index,10)||1))-1;
  const [name,desc]=namedReports[n];
  const rows=data.reports[n];
  const monthField=[0,4,6].includes(n);
  const months=monthField?[...new Set(rows.map(row=>row[0]))]:[];
  const month=months.includes(state.reportMonth)?state.reportMonth:(months.at(-1)||'');
  const selected=monthField?rows.filter(row=>row[0]===month):rows;
  const moneyCells = n===4?[2,3,4]:n===5?[4]:[];
  const formatter = new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
  main.innerHTML = title('Reports','Explore facility operations, staffing, finance, access and collaboration.')+
    '<div class="reports"><nav class="panel report-nav" aria-label="Report selection"><h2>Available reports</h2>'+
    namedReports.map(([text],i)=>'<a href="#reports/'+(i+1)+'"'+(i===n?' aria-current="page"':'')+'>'+esc(text)+'</a>').join('')+
    '</nav><section class="stack"><div class="panel">'+heading(name)+'<p class="section-copy">'+esc(desc)+'</p>'+
    (monthField?'<div class="report-toolbar">'+choice('Month','report-month',months.map(m=>[m,m]),month)+'</div>':'')+
    (n===0?'<div class="chart" aria-label="Usage hours by facility">'+selected.map(row=>{
      const top=Math.max(1,...selected.map(record=>record[2]));
      return '<div class="bar-row"><span>'+esc(row[1])+'</span><span class="bar-track" aria-hidden="true"><span class="bar-fill" style="display:block;width:'+(100*row[2]/top)+'%"></span></span><span>'+esc(row[2])+' h</span></div>';
    }).join('')+'</div>':'')+
    table(reportColumns[n],selected.map(row=>row.map((value,i)=>esc(moneyCells.includes(i)&&value!==null?formatter.format(value):value))))+
    '</div></section></div>';
  const monthPicker=document.querySelector('#report-month');
  if(monthPicker) monthPicker.onchange = () => {
    state.reportMonth=monthPicker.value;
    renderReports(n+1);
    document.querySelector('#report-month').focus();
  };
}
function renderMissing() {
  main.innerHTML=title('Page unavailable','Choose a page from the navigation.')+'<a class="button primary" href="#resources">Resource directory</a>';
}
function render(focus=true) {
  const [page,arg,id] = route();
  if(['review','review-request','reports'].includes(page)) setRole('staff');
  if(['requests','request','new'].includes(page)) setRole('researcher');
  const navSection = {equipment:'resources',facility:'resources',new:'requests',request:'requests','review-request':'review'}[page] || page;
  navLinks(navSection);
  const handlers = {
    resources:renderResources, equipment:()=>renderResource(page,arg), facility:()=>renderResource(page,arg),
    requests:()=>renderRequests(false), new:()=>renderForm(arg,id), request:()=>renderRequest(arg,false),
    review:()=>renderRequests(true), 'review-request':()=>renderRequest(arg,true), reports:()=>renderReports(arg)
  };
  (handlers[page] || renderMissing)();
  if(focus){window.scrollTo(0,0);main.focus({preventScroll:true});}
}
roleSelect.onchange=()=>{setRole(roleSelect.value);go(state.role==='staff'?'review':'resources');};
document.querySelector('.skip').onclick=event=>{event.preventDefault();main.focus();};
window.addEventListener('hashchange',()=>render());
render(false);
</script>
